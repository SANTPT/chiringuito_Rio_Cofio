<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Chiringuito del Cofio · Carta</title>
  <meta name="description" content="Carta de El Chiringuito del Cofio: picoteo, hamburguesas, bocadillos, ensaladas, platos, postres, cócteles y tapas. Urb. Río Cofio, Robledo de Chavela.">
  <meta name="theme-color" content="#15304E">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/baldosin.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="cenefa" aria-hidden="true"></div>

  <header class="cabecera">
    <img class="cabecera__baldosin" src="assets/baldosin.png" alt="Baldosín cerámico de El Chiringuito del Cofio" width="120" height="120">
    <p class="cabecera__sobre">EL CHIRINGUITO</p>
    <h1 class="cabecera__titulo">del Cofio</h1>
    <p class="cabecera__sub" id="aviso-apertura"></p>
  </header>

  <div class="navegacion-wrapper">
    <nav class="navegacion" id="navegacion" aria-label="Secciones de la carta"></nav>
  </div>

  <main class="carta" id="carta"></main>

  <footer class="pie">
    <div class="cenefa cenefa--pie" aria-hidden="true"></div>
    <div class="pie__contenido">
      <p class="pie__horarios" id="pie-horarios"></p>
      <p class="pie__direccion" id="pie-direccion"></p>
      <p class="pie__maps"><a id="pie-maps" href="#" target="_blank" rel="noopener">📍 Cómo llegar</a></p>
    </div>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
