<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiringuito del Río Cofío · Carta</title>
  <meta name="description" content="Carta de Chiringuito del Río Cofío: picoteo, hamburguesas, bocadillos, ensaladas, platos, postres, cócteles y tapas. Urb. Río Cofio, Robledo de Chavela.">
  <meta name="theme-color" content="#15304E">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/baldosin.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="cenefa" aria-hidden="true"></div>

  <header class="cabecera">
    <img class="cabecera__baldosin" src="assets/baldosin.png" alt="Baldosín cerámico de Chiringuito del Río Cofío" width="120" height="120">
    <p class="cabecera__sobre">CHIRINGUITO</p>
    <h1 class="cabecera__titulo">del Río Cofío</h1>
    <p class="cabecera__sub" id="aviso-apertura"></p>
  </header>

  <div class="navegacion-wrapper">
    <nav class="navegacion" id="navegacion" aria-label="Secciones de la carta"></nav>
  </div>

  <main class="carta" id="carta"></main>

  <footer class="pie">
    <div class="cenefa cenefa--pie" aria-hidden="true"></div>
    <div class="pie__contenido">
      <p class="pie__horarios" id="pie-horarios"></p>
      <p class="pie__direccion" id="pie-direccion"></p>
      <p class="pie__maps"><a id="pie-maps" href="#" target="_blank" rel="noopener noreferrer"><svg class="icono-mapa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" style="vertical-align: -3px; margin-right: 4px; display: inline-block;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>Cómo llegar</a></p>
    </div>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>

</html>
